<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Laboratórios - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <main class="container">
        <div class="row justify-content-center my-5">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <img src="../../imagens/logo-labstocker-branco.png" alt="Logo UFC" class="img-fluid" style="max-height: 200px;">
                        </div>
                        
                        <h2 class="text-center mb-4">Cadastrar novo Usuário</h2>
                        
                        <form id="form-register">
                            
                            <fieldset class="mb-3">
                                <legend class="fs-6">Tipo de Usuário</legend>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tipo_identificador" id="radio-siape" value="SIAPE" required>
                                    <label class="form-check-label" for="radio-siape">Técnico (SIAPE)</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="tipo_identificador" id="radio-matricula" value="MATRICULA" required>
                                    <label class="form-check-label" for="radio-matricula">Aluno (Matrícula)</label>
                                </div>
                            </fieldset>

                            <div class="mb-3">
                                <label for="register-identificador" class="form-label">Número (SIAPE / Matrícula)</label>
                                <input type="text" class="form-control" id="register-identificador" required>
                            </div>

                            <hr>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="register-nome" class="form-label">Nome</label>
                                    <input type="text" class="form-control" id="register-nome" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="register-sobrenome" class="form-label">Sobrenome</label>
                                    <input type="text" class="form-control" id="register-sobrenome" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="register-email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="register-email" required>
                            </div>

                            <div class="alert alert-info small mb-3">
                                Depois do cadastro, peça ao chefe (ou a um gestor) do seu laboratório para adicionar você pelo e-mail acima.
                            </div>
                            
                            <hr>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="register-senha" class="form-label">Senha</label>
                                    <input type="password" class="form-control" id="register-senha" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="register-confirmar-senha" class="form-label">Confirmar Senha</label>
                                    <input type="password" class="form-control" id="register-confirmar-senha" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                Cadastrar
                            </button>
                        </form>
                        
                        <div class="text-center">
                            <a href="../../index.html">Já tem uma conta? Entrar</a>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="register.js"></script>
</body>
</html>
