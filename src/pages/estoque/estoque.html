<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu estoque - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="tela-clara">

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <header class="faixa-ufc faixa-pagina">
        <div class="container faixa-pagina-conteudo">
            <a href="../dashboard/dashboard.html" class="btn-voltar" aria-label="Voltar ao painel"><i class="bi bi-arrow-left"></i></a>
            <div class="faixa-pagina-titulo">
                <h1>Estoque</h1>
                <p>Gerencie reagentes e validades</p>
            </div>
            <div class="faixa-pagina-acoes">
            <button class="btn btn-warning fw-bold text-dark px-3 py-2 rounded-pill" data-permissao="estoque.editar" data-bs-toggle="modal" data-bs-target="#modal-estoque">
                <i class="bi bi-plus-lg me-2"></i> Novo item
            </button>
            </div>
        </div>
    </header>

    <div class="container conteudo-pagina">

        <div class="painel">
            <div class="row g-2 mb-4">
                <div class="col-12 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-5 ps-3">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="input-busca-estoque" class="form-control border-start-0 search-input rounded-end-5" placeholder="Pesquisar reagente...">
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <select id="filtro-validade-estoque" class="form-select" aria-label="Filtrar por situação">
                        <option value="">Toda situação</option>
                        <option value="vencido">Vencidos</option>
                        <option value="vence_breve">Vencem em até 30 dias</option>
                        <option value="no_prazo">No prazo</option>
                        <option value="sem_data">Sem validade</option>
                        <option value="esgotado">Esgotados</option>
                    </select>
                </div>
                <div class="col-6 col-lg-2">
                    <select id="filtro-unidade-estoque" class="form-select" aria-label="Filtrar por unidade">
                        <option value="">Toda unidade</option>
                    </select>
                </div>
                <div class="col-12 col-lg-2">
                    <select id="ordenar-estoque" class="form-select" aria-label="Ordenar">
                        <option value="nome_asc">Nome (A–Z)</option>
                        <option value="nome_desc">Nome (Z–A)</option>
                    </select>
                </div>
            </div>

            <div id="loading-spinner-estoque" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Carregando frascos...</p>
            </div>
            <div id="resumo-estoque" class="resumo-estoque" aria-label="Frascos que pedem atenção"></div>
            <div class="lista-estoque" id="lista-estoque" role="list" aria-label="Itens do estoque"></div>
        </div>
    </div>

    <!-- MODAL: Adicionar/editar item de estoque -->
    <div class="modal fade" id="modal-estoque" tabindex="-1" aria-labelledby="estoque-modal-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable cadastro-dialog">
            <div class="modal-content cadastro">
                <div class="cadastro-topo">
                    <div>
                        <h2 id="estoque-modal-titulo">Novo item no estoque</h2>
                        <p id="estoque-modal-lab"></p>
                    </div>
                    <button type="button" class="cadastro-fechar" data-bs-dismiss="modal" aria-label="Fechar"><i class="bi bi-x-lg"></i></button>
                </div>

                <form id="form-estoque" class="cadastro-form" novalidate>
                    <input type="hidden" id="estoque-edit-id">
                    <input type="hidden" id="estoque-reagente">

                    <div class="modal-body cadastro-corpo">
                        <div class="campo">
                            <label for="estoque-reagente-busca" id="estoque-reagente-rotulo">Reagente</label>
                            <div id="estoque-reagente-procura">
                                <div class="busca">
                                    <i class="bi bi-search" aria-hidden="true"></i>
                                    <input type="text" class="entrada" id="estoque-reagente-busca" role="combobox"
                                        aria-autocomplete="list" aria-expanded="false" aria-controls="estoque-reagente-opcoes"
                                        aria-describedby="estoque-reagente-ajuda" autocomplete="off" placeholder="Nome, fórmula ou CAS">
                                </div>
                                <div class="resultados d-none" id="estoque-reagente-resultados">
                                    <ul class="resultados-lista" id="estoque-reagente-opcoes" role="listbox" aria-labelledby="estoque-reagente-rotulo"></ul>
                                    <div class="resultados-rodape" id="estoque-reagente-rodape"></div>
                                </div>
                                <div class="ajuda" id="estoque-reagente-ajuda">Busque pelo nome, pela fórmula ou pelo número CAS.</div>
                            </div>
                            <div class="escolhido d-none" id="estoque-reagente-escolhido"></div>
                        </div>

                        <div class="ja-tem d-none" id="estoque-ja-tem" role="status"></div>

                        <div class="campo">
                            <label for="estoque-quantidade">Quantidade</label>
                            <div class="qtd">
                                <input type="number" class="entrada" id="estoque-quantidade" step="any" min="0.01" max="1000000" inputmode="decimal" placeholder="0" required>
                                <div class="unidades" id="estoque-unidades" role="radiogroup" aria-label="Unidade"></div>
                            </div>
                        </div>

                        <div class="linha-campos">
                            <div class="campo">
                                <label for="estoque-validade">Validade</label>
                                <input type="date" class="entrada" id="estoque-validade" aria-describedby="estoque-validade-aviso">
                                <div class="vence" id="estoque-validade-aviso" aria-live="polite"></div>
                                <label class="check"><input type="checkbox" id="estoque-sem-validade"> Sem validade</label>
                            </div>
                            <div class="campo">
                                <label for="estoque-observacoes">Onde fica <span class="opcional">(opcional)</span></label>
                                <input type="text" class="entrada" id="estoque-observacoes" maxlength="500" placeholder="Ex.: armário de ácidos, prateleira 2">
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer cadastro-rodape">
                        <button type="button" class="btn btn-cancel-lab" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary btn-confirm-lab" id="estoque-salvar">Adicionar ao estoque</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: Registrar consumo -->
    <div class="modal fade" id="modal-consumo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-lab">
                <div class="modal-header modal-header-lab bg-primary text-white">
                    <div class="modal-header-icon"><i class="bi bi-eyedropper"></i></div>
                    <div>
                        <h5 class="modal-title-lab mb-0">Registrar consumo</h5>
                        <p class="modal-subtitle-lab" id="consumo-item-label">—</p>
                    </div>
                    <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-consumo">
                    <input type="hidden" id="consumo-item-id">
                    <div class="modal-body modal-body-lab">
                        <div class="mb-3">
                            <label for="consumo-quantidade" class="form-label-lab"><i class="bi bi-123"></i> Quantidade consumida</label>
                            <div class="qty-stepper">
                                <button type="button" class="qty-btn qty-btn-minus" aria-label="Diminuir quantidade"><i class="bi bi-dash-lg"></i></button>
                                <input type="number" step="0.01" min="0.01" class="qty-input" id="consumo-quantidade" required>
                                <button type="button" class="qty-btn qty-btn-plus" aria-label="Aumentar quantidade"><i class="bi bi-plus-lg"></i></button>
                            </div>
                            <small class="qty-hint" id="consumo-disponivel"></small>
                        </div>
                        <div class="mb-1">
                            <label for="consumo-finalidade" class="form-label-lab"><i class="bi bi-clipboard-check"></i> Finalidade (opcional)</label>
                            <input type="text" class="form-control rounded-pill border-0 shadow-sm px-3" id="consumo-finalidade" maxlength="300" placeholder="Ex.: aula prática, projeto de pesquisa">
                        </div>
                    </div>
                    <div class="modal-footer modal-footer-lab">
                        <button type="button" class="btn btn-cancel-lab" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary btn-confirm-lab"><i class="bi bi-check-lg"></i> Confirmar consumo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="estoque.js"></script>
</body>
</html>
