<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu estoque - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <div class="container my-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4 text-white">
            <div class="d-flex align-items-center">
                <a href="../dashboard/dashboard.html" class="btn btn-outline-light me-3 rounded-circle border-2" style="width: 45px; height: 45px; display:flex; align-items:center; justify-content:center;">
                    <i class="bi bi-arrow-left fw-bold"></i>
                </a>
                <div>
                    <h2 class="mb-0 fw-bold">estoque</h2>
                    <p class="mb-0 opacity-75 small">Gerencie reagentes e validades</p>
                </div>
            </div>
            
            <button class="btn btn-warning fw-bold text-dark shadow-lg px-4 py-2 rounded-pill" data-bs-toggle="modal" data-bs-target="#modal-estoque">
                <i class="bi bi-plus-lg me-2"></i> Novo Item
            </button>
        </div>

        <div class="glass-panel">
            
            <div class="row g-2 mb-4">
                <div class="col-12 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-5 ps-3">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="input-busca-estoque" class="form-control border-start-0 search-input rounded-end-5" placeholder="Pesquisar reagente...">
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <select id="filtro-validade-estoque" class="form-select">
                        <option value="">Toda validade</option>
                        <option value="vencido">Vencidos</option>
                        <option value="vence_breve">Vence em ≤30 dias</option>
                        <option value="no_prazo">No prazo</option>
                        <option value="sem_data">Sem validade</option>
                    </select>
                </div>
                <div class="col-6 col-lg-2">
                    <select id="filtro-unidade-estoque" class="form-select">
                        <option value="">Todas as unidades</option>
                    </select>
                </div>
                <div class="col-12 col-lg-2">
                    <select id="ordenar-estoque" class="form-select">
                        <option value="nome_asc">Nome (A–Z)</option>
                        <option value="nome_desc">Nome (Z–A)</option>
                    </select>
                </div>
            </div>

            <div id="loading-spinner-estoque" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Carregando frascos...</p>
            </div>

            <div class="list-group list-group-flush" id="lista-estoque">
                </div>
        </div>
    </div>

    <div class="modal fade" id="modal-estoque" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-primary">Adicionar Item ao estoque</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="form-estoque">
                    <input type="hidden" id="estoque-edit-id">
                    
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="estoque-reagente" class="form-label fw-bold small text-secondary">reagente</label>
                            <select class="form-select" id="estoque-reagente" required>
                                <option value="" disabled selected>Carregando catálogo...</option>
                            </select>
                        </div>

                        <div class="row g-3">
                            <div class="col-6 mb-3">
                                <label for="estoque-quantidade" class="form-label fw-bold small text-secondary">Quantidade</label>
                                <input type="number" step="0.01" min="0.01" max="1000000" class="form-control" id="estoque-quantidade" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="estoque-unidade" class="form-label fw-bold small text-secondary">Unidade</label>
                                <select class="form-select" id="estoque-unidade" required>
                                    <option value="" disabled selected>Selecione...</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="estoque-validade" class="form-label fw-bold small text-secondary">Data de Validade</label>
                            <input type="date" class="form-control" id="estoque-validade">
                        </div>

                        <div class="mb-3">
                            <label for="estoque-observacoes" class="form-label fw-bold small text-secondary">Observações</label>
                            <textarea class="form-control" id="estoque-observacoes" rows="2" maxlength="500"
                            placeholder="Localização na prateleira, estado do frasco..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="estoque.js"></script>
</body>
</html>
