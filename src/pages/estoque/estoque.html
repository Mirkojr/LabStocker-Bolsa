<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu estoque - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <div class="container my-5" >
        
        <div class="d-flex justify-content-between align-items-center gap-3 mb-4 text-white">
            <div class="d-flex align-items-center min-w-0">
                <a href="../dashboard/dashboard.html" class="btn btn-outline-light me-3 rounded-circle border-2 flex-shrink-0" style="width: 45px; height: 45px; display:flex; align-items:center; justify-content:center;">
                    <i class="bi bi-arrow-left fw-bold"></i>
                </a>
                <div>
                    <h2 class="mb-0 fw-bold">Estoque</h2>
                    <p class="mb-0 opacity-75 small">Gerencie reagentes e validades</p>
                </div>
            </div>
            
            <button class="btn btn-warning fw-bold text-dark shadow-lg px-3 px-md-4 py-2 rounded-pill text-nowrap flex-shrink-0" data-permissao="estoque.editar" data-bs-toggle="modal" data-bs-target="#modal-estoque">
                <i class="bi bi-plus-lg me-2"></i> Novo item
            </button>
        </div>

        <div class="glass-panel">
            <div class="row g-2 mb-4">
                <div class="col-12 col-lg-5">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-5 ps-3">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="input-busca-estoque" class="form-control border-start-0 search-input rounded-end-5" placeholder="Pesquisar reagente...">
                    </div>
                </div>
                <div class="col-6 col-lg-3">
                    <select id="filtro-validade-estoque" class="form-select">
                        <option value="">Toda validade</option>
                        <option value="vencido">Vencidos</option>
                        <option value="vence_breve">Vence em ≤30 dias</option>
                        <option value="no_prazo">No prazo</option>
                        <option value="sem_data">Sem validade</option>
                    </select>
                </div>
                <div class="col-6 col-lg-2">
                    <select id="filtro-unidade-estoque" class="form-select">
                        <option value="">Toda unidade</option>
                    </select>
                </div>
                <div class="col-12 col-lg-2">
                    <select id="ordenar-estoque" class="form-select">
                        <option value="nome_asc">Nome (A–Z)</option>
                        <option value="nome_desc">Nome (Z–A)</option>
                    </select>
                </div>
            </div>

            <div id="loading-spinner-estoque" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Carregando frascos...</p>
            </div>
            <div class="list-group list-group-flush" id="lista-estoque"></div>
        </div>
    </div>

    <!-- MODAL: Adicionar/editar item de estoque -->
    <div class="modal fade" id="modal-estoque" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-lab">
                <div class="modal-header modal-header-lab bg-primary text-white">
                    <div class="modal-header-icon"><i class="bi bi-box-seam"></i></div>
                    <div>
                        <h5 class="modal-title-lab mb-0">Adicionar item ao estoque</h5>
                        <p class="modal-subtitle-lab">Cadastre um novo frasco no laboratório</p>
                    </div>
                    <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="form-estoque">
                    <input type="hidden" id="estoque-edit-id">
                    
                    <div class="modal-body modal-body-lab">
                        <div class="mb-3">
                            <label for="estoque-reagente" class="form-label-lab"><i class="bi bi-droplet-half"></i> Reagente</label>
                            <select class="form-select rounded-pill border-0 shadow-sm px-3" id="estoque-reagente" required>
                                <option value="" disabled selected>Carregando catálogo...</option>
                            </select>
                        </div>

                        <div class="row g-3">
                            <div class="col-6">
                                <label for="estoque-quantidade" class="form-label-lab"><i class="bi bi-123"></i> Quantidade</label>
                                <div class="qty-stepper">
                                    <button type="button" class="qty-btn qty-btn-minus" aria-label="Diminuir quantidade"><i class="bi bi-dash-lg"></i></button>
                                    <input type="number" step="0.01" min="0.01" max="1000000" class="qty-input" id="estoque-quantidade" required>
                                    <button type="button" class="qty-btn qty-btn-plus" aria-label="Aumentar quantidade"><i class="bi bi-plus-lg"></i></button>
                                </div>
                            </div>
                            <div class="col-6">
                                <label for="estoque-unidade" class="form-label-lab"><i class="bi bi-rulers"></i> Unidade</label>
                                <select class="form-select rounded-pill border-0 shadow-sm px-3" id="estoque-unidade" required>
                                    <option value="" disabled selected>Selecione...</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3 mt-3">
                            <label for="estoque-validade" class="form-label-lab"><i class="bi bi-calendar-event"></i> Data de validade</label>
                            <input type="date" class="form-control rounded-pill border-0 shadow-sm px-3" id="estoque-validade">
                        </div>

                        <div class="mb-1">
                            <label for="estoque-observacoes" class="form-label-lab"><i class="bi bi-chat-left-text"></i> Observações</label>
                            <textarea class="form-control rounded-4 border-0 shadow-sm px-3 py-2" id="estoque-observacoes" rows="2" maxlength="500"
                            placeholder="Localização na prateleira, estado do frasco..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer modal-footer-lab">
                        <button type="button" class="btn btn-cancel-lab" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary btn-confirm-lab"><i class="bi bi-check-lg"></i> Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: Registrar consumo -->
    <div class="modal fade" id="modal-consumo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-lab">
                <div class="modal-header modal-header-lab bg-primary text-white">
                    <div class="modal-header-icon"><i class="bi bi-eyedropper"></i></div>
                    <div>
                        <h5 class="modal-title-lab mb-0">Registrar consumo</h5>
                        <p class="modal-subtitle-lab" id="consumo-item-label">—</p>
                    </div>
                    <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-consumo">
                    <input type="hidden" id="consumo-item-id">
                    <div class="modal-body modal-body-lab">
                        <div class="mb-3">
                            <label for="consumo-quantidade" class="form-label-lab"><i class="bi bi-123"></i> Quantidade consumida</label>
                            <div class="qty-stepper">
                                <button type="button" class="qty-btn qty-btn-minus" aria-label="Diminuir quantidade"><i class="bi bi-dash-lg"></i></button>
                                <input type="number" step="0.01" min="0.01" class="qty-input" id="consumo-quantidade" required>
                                <button type="button" class="qty-btn qty-btn-plus" aria-label="Aumentar quantidade"><i class="bi bi-plus-lg"></i></button>
                            </div>
                            <small class="qty-hint" id="consumo-disponivel"></small>
                        </div>
                        <div class="mb-1">
                            <label for="consumo-finalidade" class="form-label-lab"><i class="bi bi-clipboard-check"></i> Finalidade (opcional)</label>
                            <input type="text" class="form-control rounded-pill border-0 shadow-sm px-3" id="consumo-finalidade" maxlength="300" placeholder="Ex.: aula prática, projeto de pesquisa">
                        </div>
                    </div>
                    <div class="modal-footer modal-footer-lab">
                        <button type="button" class="btn btn-cancel-lab" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary btn-confirm-lab"><i class="bi bi-check-lg"></i> Confirmar consumo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="estoque.js"></script>
</body>
</html>
