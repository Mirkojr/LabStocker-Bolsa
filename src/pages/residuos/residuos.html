<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Resíduos - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        .filter-badge {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.7);
        }
        .filter-badge:hover, .filter-badge.active {
            background: var(--ufc-ouro);
            color: var(--tinta);
            border-color: var(--ufc-ouro);
        }
    </style>
</head>
<body style="background-color: #132E4B;">

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <div class="container my-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4 text-white">
            <div class="d-flex align-items-center">
                <a href="../dashboard/dashboard.html" class="btn btn-outline-light me-3 rounded-circle border-2" style="width: 45px; height: 45px; display:flex; align-items:center; justify-content:center;">
                    <i class="bi bi-arrow-left fw-bold"></i>
                </a>
                <div>
                    <h2 class="mb-0 fw-bold">Gestão de Resíduos</h2>
                    <p class="mb-0 opacity-75 small">Controle de descartes e inventário de efluentes</p>
                </div>
            </div>
            
            <button class="btn btn-warning fw-bold text-dark shadow-lg px-4 py-2 rounded-pill" data-permissao="residuo.registrar" data-bs-toggle="modal" data-bs-target="#modal-residuo">
                <i class="bi bi-plus-lg me-2"></i> Registrar resíduo
            </button>
        </div>

        <div class="glass-panel-dark">
            
            <div class="d-flex gap-2 mb-4 overflow-auto pb-2">
                <span class="badge rounded-pill px-3 py-2 filter-badge active">Todos</span>
                <span class="badge rounded-pill px-3 py-2 filter-badge">Inflamável</span>
                <span class="badge rounded-pill px-3 py-2 filter-badge">Corrosivo</span>
                <span class="badge rounded-pill px-3 py-2 filter-badge">Biológico</span>
            </div>
            
            <div id="spinner-res" class="text-center py-5 d-none">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted-light">Sincronizando inventário...</p>
            </div>

            <div class="row g-4" id="lista-residuos">
                </div>
        </div>
    </div>

    <!-- MODAL: Registrar/editar resíduo -->
    <div class="modal fade" id="modal-residuo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-lab">
                <div class="modal-header modal-header-lab bg-primary text-white">
                    <div class="modal-header-icon"><i class="bi bi-recycle"></i></div>
                    <div>
                        <h5 class="modal-title-lab mb-0">Registrar resíduo</h5>
                        <p class="modal-subtitle-lab">Controle de descarte e destinação</p>
                    </div>
                    <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="form-residuo">
                    <input type="hidden" id="edit-residuo-id">
                    
                    <div class="modal-body modal-body-lab">
                        <div class="mb-3">
                            <label for="res-descricao" class="form-label-lab"><i class="bi bi-card-text"></i> Descrição do material</label>
                            <input type="text" class="form-control rounded-pill border-0 shadow-sm px-3" id="res-descricao" placeholder="Ex.: mistura de solventes orgânicos" required>
                        </div>

                        <div class="mb-3">
                            <label for="res-tipo" class="form-label-lab"><i class="bi bi-shield-exclamation"></i> Tipo de perigo principal</label>
                            <select class="form-select rounded-pill border-0 shadow-sm px-3" id="res-tipo" required>
                                <option value="" disabled selected>Selecione a categoria...</option>
                                <option value="Inflamavel">Inflamável</option>
                                <option value="Toxico">Tóxico</option>
                                <option value="Corrosivo">Corrosivo (Ácido/Base)</option>
                                <option value="Biologico">Biológico</option>
                                <option value="Outro">Outro / mistura</option>
                            </select>
                        </div>

                        <div class="row g-3">
                            <div class="col-6">
                                <label for="res-qtd" class="form-label-lab"><i class="bi bi-123"></i> Quantidade</label>
                                <div class="qty-stepper">
                                    <button type="button" class="qty-btn qty-btn-minus" aria-label="Diminuir quantidade"><i class="bi bi-dash-lg"></i></button>
                                    <input type="number" step="0.01" min="0.01" class="qty-input" id="res-qtd" required>
                                    <button type="button" class="qty-btn qty-btn-plus" aria-label="Aumentar quantidade"><i class="bi bi-plus-lg"></i></button>
                                </div>
                            </div>
                            <div class="col-6">
                                <label for="res-unidade" class="form-label-lab"><i class="bi bi-rulers"></i> Unidade</label>
                                <select class="form-select rounded-pill border-0 shadow-sm px-3" id="res-unidade" required>
                                    <option value="" disabled selected>Selecione...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-footer modal-footer-lab">
                        <button type="button" class="btn btn-cancel-lab" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary btn-confirm-lab"><i class="bi bi-check-lg"></i> Salvar registro</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="residuos.js"></script>
</body>
</html>
