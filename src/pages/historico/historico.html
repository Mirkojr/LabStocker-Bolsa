<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="tela-clara">

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <header class="faixa-ufc faixa-pagina">
        <div class="container faixa-pagina-conteudo">
            <a href="../dashboard/dashboard.html" class="btn-voltar" aria-label="Voltar ao painel"><i class="bi bi-arrow-left"></i></a>
            <div class="faixa-pagina-titulo">
                <h1>Histórico</h1>
                <p>Entradas, consumos, transferências e descartes do laboratório</p>
            </div>
        </div>
    </header>

    <div class="container conteudo-pagina">

        <div class="painel">
            
            <div class="mb-4">
                <div class="input-group shadow-sm rounded-pill overflow-hidden border">
                    <span class="input-group-text bg-white border-0 ps-3">
                        <i class="bi bi-search text-secondary"></i>
                    </span>
                    <input type="text" id="busca-historico" class="form-control border-0 py-3" placeholder="Filtrar por reagente, laboratório ou tipo...">
                </div>
            </div>
            
            <div class="mb-4 small d-flex flex-wrap gap-3 px-2">
                <span><i class="bi bi-circle-fill me-1 small text-success"></i> Entrada</span>
                <span><i class="bi bi-circle-fill me-1 small text-danger"></i> Saída</span>
                <span><i class="bi bi-circle-fill me-1 small text-info"></i> Consumo</span>
                <span><i class="bi bi-circle-fill me-1 small" style="color: var(--ufc-ouro)"></i> Pedido</span>
                <span><i class="bi bi-circle-fill me-1 small text-secondary"></i> Descarte</span>
            </div>
            
            <div id="spinner-hist" class="text-center py-5 d-none">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted small">Carregando o histórico...</p>
            </div>

            <div class="list-group list-group-flush" id="lista-historico">
                </div>

        </div> 
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="historico.js"></script>
</body>
</html>
