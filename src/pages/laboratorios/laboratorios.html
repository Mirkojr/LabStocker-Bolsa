<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratórios - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="tela-clara">

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <header class="faixa-ufc faixa-pagina">
        <div class="container faixa-pagina-conteudo">
            <a href="../dashboard/dashboard.html" class="btn-voltar" aria-label="Voltar ao painel"><i class="bi bi-arrow-left"></i></a>
            <div class="faixa-pagina-titulo">
                <h1>Laboratórios</h1>
                <p>Consulte o estoque de outros laboratórios e faça pedidos de reagentes</p>
            </div>
        </div>
    </header>

    <div class="container conteudo-pagina">

        <div class="painel">
            
            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden border">
                        <span class="input-group-text bg-white border-0 ps-3">
                            <i class="bi bi-search text-primary"></i>
                        </span>
                        <input type="text" id="busca-lab" class="form-control border-0 py-3" placeholder="Buscar laboratório por nome ou código SIPAC...">
                    </div>
                </div>
            </div>

            <div id="spinner-lab" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Carregando laboratórios...</p>
            </div>

            <div class="row g-4" id="grid-laboratorios">
                </div>
        </div>
    </div>

    <div class="modal fade" id="modal-estoque-externo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header bg-primary text-white border-0 py-3" style="border-radius: 20px 20px 0 0;">
                    <h5 class="modal-title fw-bold" id="titulo-lab-selecionado">Estoque do laboratório</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="input-group mb-4 shadow-sm rounded-pill overflow-hidden border">
                        <span class="input-group-text bg-light border-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="busca-estoque-externo" class="form-control border-0" placeholder="Buscar reagente neste estoque...">
                    </div>
                    
                    <div class="list-group list-group-flush rounded-3 border" id="lista-estoque-externo">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-solicitar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">Pedir reagente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-solicitacao">
                    <div class="modal-body py-4">
                        <p id="texto-solicitacao" class="small text-muted mb-3">Informe a quantidade desejada:</p>
                        
                        <div class="input-group shadow-sm">
                            <input type="number" step="0.01" class="form-control border-end-0" id="qtd-solicitada" required>
                            <span class="input-group-text bg-light border-start-0 fw-bold" id="unidade-solicitada">un</span>
                        </div>
                        
                        <div class="form-text text-danger d-none mt-2 fw-bold" id="erro-qtd">
                            <i class="bi bi-exclamation-circle me-1"></i> Quantidade acima do disponível!
                        </div>

                        <input type="hidden" id="solic-item-id">
                        <input type="hidden" id="solic-lab-destino">
                        <input type="hidden" id="solic-max-qtd">
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2">Enviar pedido</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="laboratorios.js"></script>
</body>
</html>
