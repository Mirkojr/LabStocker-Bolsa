<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar reagentes - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <div class="container my-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4 text-white">
            <div class="d-flex align-items-center">
                <a href="../dashboard/dashboard.html" class="btn btn-outline-light me-3 rounded-circle border-2" style="width: 45px; height: 45px; display:flex; align-items:center; justify-content:center;">
                    <i class="bi bi-arrow-left fw-bold"></i>
                </a>
                <div>
                    <h2 class="mb-0 fw-bold">Catálogo de reagentes</h2>
                    <p class="mb-0 opacity-75 small">Gerencie os tipos de insumos disponíveis</p>
                </div>
            </div>
            
            <button class="btn btn-warning fw-bold text-dark shadow-lg px-4 py-2 rounded-pill" data-bs-toggle="modal" data-bs-target="#modal-reagente">
                <i class="bi bi-plus-lg me-2"></i> Novo reagente
            </button>
        </div>

        <div class="glass-panel">

            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-5 ps-3">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="input-busca" class="form-control border-start-0 search-input rounded-end-5" placeholder="Pesquisar por nome ou fórmula...">
                    </div>
                </div>
            </div>
            
            <div id="loading-spinner" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted">Carregando catálogo...</p>
            </div>

            <div class="list-group list-group-flush" id="lista-reagentes">
                </div>

        </div> 
    </div>

    <div class="modal fade" id="modal-reagente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header bg-light border-bottom-0">
                    <h5 class="modal-title fw-bold text-primary">Cadastrar Novo reagente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="form-reagente">
                    <input type="hidden" id="reagente-edit-id">
                    
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="reagente-nome" class="form-label fw-bold small text-secondary">Nome do reagente</label>
                            <input type="text" class="form-control rounded-pill" id="reagente-nome" placeholder="Ex: Ácido Sulfúrico" required>
                        </div>
                        <div class="mb-3">
                            <label for="reagente-composicao" class="form-label fw-bold small text-secondary">Composição / Fórmula</label>
                            <input type="text" class="form-control rounded-pill" id="reagente-composicao" placeholder="Ex: H2SO4" required>
                        </div>
                        <div class="mb-3">
                            <label for="reagente-controladora" class="form-label fw-bold small text-secondary">Instituição Controladora (Opcional)</label>
                            <input type="text" class="form-control rounded-pill" id="reagente-controladora" placeholder="Ex: Polícia Federal, Exército">
                        </div>
                    </div>
                    <div class="modal-footer border-top-0">
                        <button type="button" class="btn btn-outline-secondary rounded-pill" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-confirmacao" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold text-danger">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmar Exclusão
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-4">
                    <div class="mb-3">
                         <i class="bi bi-trash3 text-danger opacity-25" style="font-size: 4rem;"></i>
                    </div>
                    <p class="mb-0 fs-5 text-secondary fw-bold">Tem certeza que deseja excluir?</p>
                    <p class="small text-muted mt-2 px-4">Esta ação removerá o reagente do catálogo permanentemente. Isso não pode ser desfeito.</p>
                </div>
                <div class="modal-footer border-top-0 justify-content-center pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btn-confirmar-exclusao" class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm">
                        Sim, Excluir
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="reagentes.js"></script>
</body>
</html>
