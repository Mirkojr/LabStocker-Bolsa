<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admins do Sistema (Admin) - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <script type="module" src="../../shared/authGuard.js"></script>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-warning">
                    <div class="card-header bg-warning text-dark fw-bold">
                        <i class="bi bi-shield-lock-fill"></i> Área do Administrador
                    </div>
                    <div class="card-body p-4">
                        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Admins do Sistema</h2>
                            <div class="d-flex gap-2">
                                <a href="admin-labs.html" class="btn btn-outline-dark"><i class="bi bi-building me-1"></i>Laboratórios</a>
                                <a href="../dashboard/dashboard.html" class="btn btn-outline-dark">Voltar</a>
                            </div>
                        </div>

                        <div class="card bg-light mb-4">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Cadastrar novo admin</h5>
                                <form id="form-admin">
                                    <div class="row g-2">
                                        <div class="col-md-9">
                                            <label for="admin-email" class="visually-hidden">E-mail</label>
                                            <input type="email" id="admin-email" class="form-control" placeholder="E-mail da conta (pessoa@ufc.br)" required>
                                        </div>
                                        <div class="col-md-3">
                                            <button type="submit" class="btn btn-dark w-100">Cadastrar</button>
                                        </div>
                                    </div>
                                    <div class="form-text">A pessoa precisa já ter conta. Admins gerenciam laboratórios, chefes e outros admins, e leem tudo, mas não operam o estoque dos laboratórios.</div>
                                </form>
                            </div>
                        </div>

                        <h5>Admins ativos</h5>
                        <ul class="list-group mt-3 mb-4" id="lista-admins">
                            <li class="list-group-item text-center py-3">
                                <div class="spinner-border spinner-border-sm" role="status"></div> Carregando...
                            </li>
                        </ul>

                        <details id="historico-admins" class="d-none">
                            <summary class="fw-bold mb-2" style="cursor: pointer;">Histórico</summary>
                            <ul class="list-group small" id="lista-historico-admins"></ul>
                        </details>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="admin-admins.js"></script>
</body>
</html>
