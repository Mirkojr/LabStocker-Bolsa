<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratórios e chefes - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="tela-clara">

    <script type="module" src="../../shared/authGuard.js"></script>

    <header class="faixa-ufc faixa-pagina">
        <div class="container faixa-pagina-conteudo">
            <a href="../dashboard/dashboard.html" class="btn-voltar" aria-label="Voltar ao painel"><i class="bi bi-arrow-left"></i></a>
            <div class="faixa-pagina-titulo">
                <h1>Laboratórios e chefes</h1>
                <p>Administração do sistema</p>
            </div>
            <div class="faixa-pagina-acoes">
                <a href="admin-admins.html" class="btn btn-outline-light rounded-pill px-3"><i class="bi bi-person-badge me-1"></i>Admins</a>
            </div>
        </div>
    </header>

    <div class="container conteudo-pagina">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="painel painel-admin">
                    <div>

                        <div class="card bg-light mb-4">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Cadastrar laboratório</h5>
                                <form id="form-lab">
                                    <div class="row g-2">
                                        <div class="col-md-6">
                                            <input type="text" id="lab-nome" class="form-control" placeholder="Nome do laboratório" required>
                                        </div>
                                        <div class="col-md-4">
                                            <input type="text" id="lab-sipac" class="form-control" placeholder="Código SIPAC" required>
                                        </div>
                                        <div class="col-md-2">
                                            <button type="submit" class="btn btn-primary w-100">Criar</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Laboratórios cadastrados</h5>
                            <span id="resumo-sem-chefe" class="validade-breve d-none"></span>
                        </div>
                        <ul class="list-group mt-3" id="lista-labs">
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm" role="status"></div> Carregando...
                            </div>
                        </ul>

                    </div>
                </div> 
            </div>
        </div>
    </div>
    
    <!-- MODAL: definir / trocar chefe -->
    <div class="modal fade" id="modal-chefe" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" id="form-chefe">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title fw-bold" id="titulo-modal-chefe">Definir chefe</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="chefe-lab-id">
                    <p class="small text-muted" id="chefe-aviso"></p>
                    <div class="mb-3">
                        <label for="chefe-email" class="form-label fw-bold small">E-mail do novo chefe</label>
                        <input type="email" id="chefe-email" class="form-control" placeholder="pessoa@ufc.br" required>
                        <div class="form-text">A pessoa precisa já ter conta no LabStocker.</div>
                    </div>
                    <div class="mb-1">
                        <label for="chefe-motivo" class="form-label fw-bold small">Motivo da troca (opcional)</label>
                        <input type="text" id="chefe-motivo" class="form-control" maxlength="300" placeholder="Ex.: nova coordenação">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="admin-labs.js"></script>
</body>
</html>
