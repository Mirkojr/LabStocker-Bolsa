<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Solicitações - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <script type="module" src="../../shared/authGuard.js"></script>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <img src="../../imagens/logo-labstocker-branco.png" alt="Logo" class="img-fluid" style="max-height: 150px;">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                            <h2 class="h3 mb-0 text-primary">Histórico de Solicitações</h2>
                            <a href="../dashboard/dashboard.html" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left"></i> Voltar ao Painel
                            </a>
                        </div>

                        <div class="list-group list-group-flush" id="lista-projetos">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                                <p class="mt-2 text-muted">Buscando histórico...</p>
                            </div>
                        </div>

                    </div>
                </div> 

            </div>
        </div>
    </div>

    <script type="module">
        import { supabaseClient } from '../../shared/supabaseClient.js';

        async function carregarProjetos() {
            // Alteração: Removemos o filtro de status para trazer TUDO.
            // Ordenamos por data de criação (mais recente primeiro)
            const { data, error } = await supabaseClient
                .from('projetos')
                .select('id, titulo_projeto, responsavel_nome, created_at, status')
                .order('created_at', { ascending: false });

            const lista = document.getElementById('lista-projetos');
            lista.innerHTML = '';

            if (error) {
                console.error(error);
                lista.innerHTML = `<div class="alert alert-danger">Erro ao carregar solicitações.</div>`;
                return;
            }

            if (!data || data.length === 0) {
                lista.innerHTML = `<div class="text-center py-5 text-muted"><p>Nenhuma solicitação encontrada.</p></div>`;
                return;
            }

            data.forEach(proj => {
                const item = document.createElement('a');
                item.href = `admin-detalhes-projeto.html?id=${proj.id}`;
                item.className = 'list-group-item list-group-item-action py-3';
                
                const dataCriacao = new Date(proj.created_at).toLocaleDateString('pt-BR');
                
                // Lógica da Etiqueta (Badge)
                let badge = '';
                if (proj.status === 'aprovado') {
                    badge = `<span class="badge bg-success"><i class="bi bi-check-circle"></i> Aprovado</span>`;
                } else {
                    badge = `<span class="badge bg-warning text-dark"><i class="bi bi-hourglass-split"></i> Pendente</span>`;
                }

                item.innerHTML = `
                    <div class="d-flex w-100 justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1 fw-bold text-dark">${proj.titulo_projeto}</h5>
                            <p class="mb-1 text-secondary">Responsável: ${proj.responsavel_nome}</p>
                        </div>
                        <div class="text-end">
                            <small class="text-muted d-block mb-1">${dataCriacao}</small>
                            ${badge}
                        </div>
                    </div>
                `;
                lista.appendChild(item);
            });
        }

        carregarProjetos();
    </script>
</body>
</html>
