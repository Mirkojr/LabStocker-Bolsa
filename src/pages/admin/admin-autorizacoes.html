<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitações de autorização - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="tela-clara">

    <script type="module" src="../../shared/authGuard.js"></script>

    <header class="faixa-ufc faixa-pagina">
        <div class="container faixa-pagina-conteudo">
            <a href="../dashboard/dashboard.html" class="btn-voltar" aria-label="Voltar ao painel"><i class="bi bi-arrow-left"></i></a>
            <div class="faixa-pagina-titulo">
                <h1>Solicitações de autorização</h1>
                <p>Administração do sistema</p>
            </div>
        </div>
    </header>

    <div class="container conteudo-pagina">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                <div class="painel painel-admin">
                    <div>

                        <div class="list-group list-group-flush" id="lista-projetos">
                            <div class="text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Carregando...</span>
                                </div>
                                <p class="mt-2 text-muted">Carregando solicitações...</p>
                            </div>
                        </div>

                    </div>
                </div> 

            </div>
        </div>
    </div>

    <script type="module">
        import { listarTodosProjetos } from '../../shared/services/projetosService.js';
        import { escapeHtml } from '../../shared/utils/dom.js';

        async function carregarProjetos() {
            const { data, error } = await listarTodosProjetos();

            const lista = document.getElementById('lista-projetos');
            lista.innerHTML = '';

            if (error) {
                console.error(error);
                lista.innerHTML = `<div class="alert alert-danger">Erro ao carregar solicitações.</div>`;
                return;
            }

            if (!data || data.length === 0) {
                lista.innerHTML = `<div class="text-center py-5 text-muted"><p>Nenhuma solicitação encontrada.</p></div>`;
                return;
            }

            data.forEach(proj => {
                const item = document.createElement('a');
                item.href = `admin-detalhes-projeto.html?id=${encodeURIComponent(proj.id)}`;
                item.className = 'list-group-item list-group-item-action py-3';

                const dataCriacao = new Date(proj.created_at).toLocaleDateString('pt-BR');

                let badge = '';
                if (proj.status === 'aprovado') {
                    badge = `<span class="badge bg-success"><i class="bi bi-check-circle"></i> Aprovado</span>`;
                } else if (proj.status === 'recusado') {
                    badge = `<span class="badge bg-danger"><i class="bi bi-x-circle"></i> Recusado</span>`;
                } else {
                    badge = `<span class="badge bg-warning text-dark"><i class="bi bi-hourglass-split"></i> Pendente</span>`;
                }

                item.innerHTML = `
                    <div class="d-flex w-100 justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1 fw-bold text-dark">${escapeHtml(proj.titulo_projeto)}</h5>
                            <p class="mb-1 text-secondary">Responsável: ${escapeHtml(proj.responsavel_nome)}</p>
                        </div>
                        <div class="text-end">
                            <small class="text-muted d-block mb-1">${dataCriacao}</small>
                            ${badge}
                        </div>
                    </div>
                `;
                lista.appendChild(item);
            });
        }

        carregarProjetos();
    </script>
</body>
</html>
