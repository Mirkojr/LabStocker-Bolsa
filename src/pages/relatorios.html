<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div id="toast-container"></div>

    <div class="container my-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4 text-white">
            <div class="d-flex align-items-center">
                <a href="dashboard.html" class="btn btn-outline-light me-3 rounded-circle border-2" style="width: 45px; height: 45px; display:flex; align-items:center; justify-content:center;">
                    <i class="bi bi-arrow-left fw-bold"></i>
                </a>
                <div>
                    <h2 class="mb-0 fw-bold">Relatórios de Movimentação</h2>
                    <p class="mb-0 opacity-75 small">Entradas, saídas e descartes do laboratório</p>
                </div>
            </div>
        </div>

        <div class="glass-panel">

            <div class="alert alert-light border shadow-sm rounded-4 mb-4 d-flex align-items-center">
                <i class="bi bi-info-circle-fill text-primary fs-4 me-3"></i>
                <div>
                    <strong>Gere extratos detalhados</strong>
                    <div class="small text-muted">Selecione o período abaixo para visualizar na tela ou baixar o arquivo .CSV (Excel).</div>
                </div>
            </div>

            <form id="form-relatorio" class="row g-3 mb-5 align-items-end">
                <div class="col-md-4">
                    <label for="data-inicio" class="form-label fw-bold text-secondary small text-uppercase">Data Início</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-5 ps-3"><i class="bi bi-calendar-event text-primary"></i></span>
                        <input type="date" class="form-control border-start-0 rounded-end-5 ps-2 py-2" id="data-inicio" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="data-fim" class="form-label fw-bold text-secondary small text-uppercase">Data Fim</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 rounded-start-5 ps-3"><i class="bi bi-calendar-event-fill text-primary"></i></span>
                        <input type="date" class="form-control border-start-0 rounded-end-5 ps-2 py-2" id="data-fim" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold shadow-sm">
                        <i class="bi bi-file-earmark-spreadsheet me-2"></i> Baixar Relatório (CSV)
                    </button>
                </div>
            </form>

            <div class="d-flex align-items-center justify-content-between mb-3 border-bottom pb-2">
                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-eye me-2"></i>Pré-visualização</h5>
                <small class="text-muted bg-white px-3 py-1 rounded-pill border">Últimos registros do período</small>
            </div>

            <div class="table-responsive rounded-3 border">
                <table class="table table-hover table-striped mb-0" id="tabela-preview">
                    <thead class="table-dark">
                        <tr>
                            <th class="py-3 ps-3">Data</th>
                            <th class="py-3">Tipo</th>
                            <th class="py-3">Item</th>
                            <th class="py-3">Qtd.</th>
                            <th class="py-3 pe-3">Detalhes</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-preview" class="bg-white">
                        <tr><td colspan="5" class="text-center text-muted py-5">Carregando dados...</td></tr>
                    </tbody>
                </table>
            </div>

        </div> 
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/relatorios.js"></script>
</body>
</html>
