<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipe - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <div class="container my-5">

        <div class="d-flex justify-content-between align-items-center mb-4 text-white">
            <div class="d-flex align-items-center">
                <a href="../dashboard/dashboard.html" class="btn btn-outline-light me-3 rounded-circle border-2" style="width: 45px; height: 45px; display:flex; align-items:center; justify-content:center;">
                    <i class="bi bi-arrow-left fw-bold"></i>
                </a>
                <div>
                    <h2 class="mb-0 fw-bold">Equipe do laboratório</h2>
                    <p class="mb-0 opacity-75 small" id="equipe-subtitulo">Carregando...</p>
                </div>
            </div>
        </div>

        <div class="glass-panel-dark">

            <!-- Adicionar pessoa (chefe e gestor) -->
            <form id="form-vinculo" class="d-none mb-4 p-3 rounded-4" style="background: rgba(255,255,255,0.06);">
                <h6 class="text-white fw-bold mb-3"><i class="bi bi-person-plus-fill me-2"></i>Adicionar pessoa ao laboratório</h6>
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-md-5">
                        <label for="vinculo-email" class="form-label small text-muted-light mb-1">E-mail da conta</label>
                        <input type="email" id="vinculo-email" class="form-control" placeholder="pessoa@ufc.br" required>
                    </div>
                    <div class="col-6 col-md-2">
                        <label for="vinculo-papel" class="form-label small text-muted-light mb-1">Papel</label>
                        <select id="vinculo-papel" class="form-select">
                            <option value="membro">Membro</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="vinculo-validade" class="form-label small text-muted-light mb-1">Válido até (opcional)</label>
                        <input type="date" id="vinculo-validade" class="form-control">
                    </div>
                    <div class="col-12 col-md-2">
                        <button type="submit" class="btn btn-warning fw-bold w-100">Adicionar</button>
                    </div>
                </div>
                <p class="small text-muted-light mb-0 mt-2">
                    A pessoa precisa já ter criado a conta no LabStocker. Se ela já tiver vínculo aqui, o papel é substituído.
                </p>
            </form>

            <div id="lista-usuarios"></div>

            <div id="spinner-users" class="text-center py-5 d-none">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted-light">Carregando equipe...</p>
            </div>

            <details id="historico-vinculos" class="mt-4 d-none">
                <summary class="text-white fw-bold mb-3" style="cursor: pointer;">
                    <i class="bi bi-clock-history me-2"></i>Histórico de vínculos
                </summary>
                <div id="lista-historico"></div>
            </details>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="usuarios.js"></script>
</body>
</html>
