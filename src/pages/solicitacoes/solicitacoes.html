<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos recebidos - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="tela-clara">

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <header class="faixa-ufc faixa-pagina">
        <div class="container faixa-pagina-conteudo">
            <a href="../dashboard/dashboard.html" class="btn-voltar" aria-label="Voltar ao painel"><i class="bi bi-arrow-left"></i></a>
            <div class="faixa-pagina-titulo">
                <h1>Pedidos recebidos</h1>
                <p>Pedidos de reagentes feitos por outros laboratórios</p>
            </div>
        </div>
    </header>

    <div class="container conteudo-pagina">

        <div class="painel">
            
            <div class="alert alert-light border mb-4 d-flex align-items-center" style=" border-radius: 15px;">
                <i class="bi bi-info-circle-fill text-info me-3 fs-4"></i>
                <div class="small">
                    <strong>Atenção:</strong> ao aprovar um pedido, a quantidade sai do seu estoque na hora e a transferência fica registrada no histórico dos dois laboratórios.
                </div>
            </div>

            <div id="spinner-solic" class="text-center py-5 d-none">
                <div class="spinner-border text-info" role="status"></div>
                <p class="mt-2 text-muted small">Carregando pedidos...</p>
            </div>

            <div class="list-group list-group-flush" id="lista-pedidos">
                </div>

        </div> 
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="solicitacoes.js"></script>
</body>
</html>
