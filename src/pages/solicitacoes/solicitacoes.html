<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos recebidos - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body class="tela-clara">

    <script type="module" src="../../shared/authGuard.js"></script>

    <div id="toast-container"></div>

    <header class="faixa-ufc faixa-pagina">
        <div class="container faixa-pagina-conteudo">
            <a href="../dashboard/dashboard.html" class="btn-voltar" aria-label="Voltar ao painel"><i class="bi bi-arrow-left"></i></a>
            <div class="faixa-pagina-titulo">
                <h1>Pedidos recebidos</h1>
                <p>Pedidos de reagentes feitos por outros laboratórios</p>
            </div>
        </div>
    </header>

    <div class="container conteudo-pagina">

        <div class="painel">
            
            <div class="resumo-estoque" id="abas-pedidos" role="group" aria-label="Mostrar pedidos">
                <button type="button" class="btn-resumo" data-aba="pendentes" aria-pressed="true">Pendentes</button>
                <button type="button" class="btn-resumo" data-aba="decididos" aria-pressed="false">Aprovados e recusados</button>
            </div>
            <p class="small text-muted mb-3">
                <i class="bi bi-info-circle me-1"></i>Ao aprovar, a quantidade sai do seu estoque na hora e a transferência fica no histórico dos dois laboratórios.
            </p>

            <div id="spinner-solic" class="text-center py-5 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2 text-muted small">Carregando pedidos...</p>
            </div>

            <div class="lista-pedidos" id="lista-pedidos" role="list" aria-label="Pedidos">
                </div>

        </div> 
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="solicitacoes.js"></script>
</body>
</html>
