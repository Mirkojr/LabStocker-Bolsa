<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon/site.webmanifest">
</head>
<body class="tela-clara">

    <div id="toast-container"></div>

    <header class="faixa-ufc faixa-entrada">
        <div class="container faixa-entrada-conteudo">
            <div class="marca">
                <span class="marca-brasao"><img src="imagens/logo-ufc.png" alt=""></span>
                <span>
                    <span class="marca-nome">LabStocker</span>
                    <span class="marca-instituicao">Universidade Federal do Ceará</span>
                </span>
            </div>
            <h1>Reagentes, estoque e resíduos dos laboratórios</h1>
        </div>
    </header>

    <main class="container entrada">
        <div class="painel cartao-entrada">
            <h2 class="h4 fw-bold mb-4">Entrar</h2>

            <form id="form-login">
                <div class="mb-3">
                    <label for="login-email" class="form-label fw-bold small">E-mail institucional</label>
                    <input type="email" class="form-control" id="login-email" placeholder="nome@ufc.br" autocomplete="email" required>
                </div>

                <div class="mb-4">
                    <label for="login-senha" class="form-label fw-bold small">Senha</label>
                    <input type="password" class="form-control" id="login-senha" placeholder="Sua senha" autocomplete="current-password" required>
                </div>

                <button type="submit" class="btn btn-contrast w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                </button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                Ainda não tem conta? <a href="pages/register/register.html" class="fw-bold">Criar conta</a>
            </p>
        </div>
    </main>

    <script type="module" src="auth.js"></script>
</body>
</html>
