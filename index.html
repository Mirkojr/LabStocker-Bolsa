<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GestorLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
        }
        .form-control {
            border-radius: 50px; 
            padding: 12px 20px;
        }
        .btn-rounded {
            border-radius: 50px;
            padding: 12px 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <main class="login-wrapper">
        <div class="login-card">
            
            <div class="glass-panel text-center">

                <div class="mb-4">
                    <img src="imagens/logo-labstocker.png" alt="Logo LabStocker" class="img-fluid" style="max-height: 120px;">
                    </div>

                <h3 class="text-primary fw-bold mb-4">Bem-vindo de volta!</h3>
                
                <form id="form-login" class="text-start">
                    <div class="mb-3">
                        <label for="login-email" class="form-label ms-3 small text-muted fw-bold">Email Institucional</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-5 bg-light border-end-0 ps-3">
                                <i class="bi bi-envelope text-primary"></i>
                            </span>
                            <input type="email" class="form-control border-start-0 ps-2" id="login-email" placeholder="seu.email@ufc.br" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="login-senha" class="form-label ms-3 small text-muted fw-bold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text rounded-start-5 bg-light border-end-0 ps-3">
                                <i class="bi bi-lock text-primary"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 ps-2" id="login-senha" placeholder="Sua senha segura" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-rounded shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Entrar no Sistema
                    </button>
                </form>
                
                <div class="d-flex align-items-center justify-content-between my-4">
                    <hr class="flex-grow-1">
                    <span class="mx-3 text-muted small">Novo por aqui?</span>
                    <hr class="flex-grow-1">
                </div>
                
                <a href="pages/register.html" class="btn btn-outline-dark w-100 btn-rounded">
                    Criar Conta
                </a>

                <div class="mt-4 opacity-50">
                    <img src="imagens/logo-ufc.png" alt="Logo UFC" class="img-fluid" style="max-height: 60px; filter: grayscale(100%);">
                </div>

            </div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
