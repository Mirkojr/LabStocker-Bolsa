<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/favicon/favicon-16x16.png">
    <link rel="manifest" href="imagens/favicon/site.webmanifest">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #0a1929 0%, #10263e 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <main class="login-wrapper">
        <div class="login-card">
            
            <div class="glass-panel-dark text-center">

                <div class="mb-4">
                    <img src="imagens/logo-labstocker.png" alt="Logo LabStocker" class="img-fluid rounded-3" style="max-height: 130px;">
                </div>

                <h3 class="fw-bold mb-1 text-white">Bem-vindo</h3>
                <p class="text-muted-light mb-4 small">Acesse o sistema de gestão laboratorial</p>
                
                <form id="form-login" class="text-start">
                    
                    <div class="mb-3">
                        <label for="login-email" class="form-label ms-3 small text-muted-light fw-bold">Email Institucional</label>
                        <div class="input-group">
                            <span class="input-group-text-dark">
                                <i class="bi bi-envelope-fill"></i>
                            </span>
                            <input type="email" class="form-control form-control-dark" id="login-email" placeholder="seu.email@ufc.br" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="login-senha" class="form-label ms-3 small text-muted-light fw-bold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text-dark">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password" class="form-control form-control-dark" id="login-senha" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-contrast w-100 shadow mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Entrar
                    </button>
                </form>
                
                <div class="d-flex align-items-center justify-content-between my-4">
                    <hr class="flex-grow-1 border-secondary opacity-50">
                    <span class="mx-3 text-muted-light small">ou</span>
                    <hr class="flex-grow-1 border-secondary opacity-50">
                </div>
                
                <a href="pages/register.html" class="btn btn-outline-light-custom w-100 text-decoration-none small">
                    Criar uma conta
                </a>

                <div class="mt-4 opacity-25">
                    <img src="imagens/logo-ufc.png" alt="Logo UFC" class="img-fluid" style="max-height: 50px; filter: grayscale(100%) brightness(200%);">
                </div>

            </div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
