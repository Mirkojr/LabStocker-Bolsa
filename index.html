<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Laboratórios - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #132E4B;">

    <main class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    
                    <div class="card-body p-4">

                        <div class="text-center mb-4">
                            <img src="imagens/logo-labstocker-branco.png" alt="Logo UFC" class="img-fluid" style="max-height: 200px;">
                        </div>


                        <div>
                            <h2 class="text-center mb-4">Gestor de Laboratórios</h2>
                            
                            <form id="form-login">
                                <div class="mb-3">
                                    <label for="login-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="login-email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="login-senha" class="form-label">Senha</label>
                                    <input type="password" class="form-control" id="login-senha" required>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100 mb-3">
                                    Entrar
                                </button>
                            </form>
                            
                            <hr>
                            
                            <a href="pages/register.html" class="btn btn-outline-secondary w-100">
                                Cadastrar-se
                            </a>
                        </div>
                        <div class="text-center mt-4">
                            <img src="imagens/logo-ufc.png" alt="Logo UFC" class="img-fluid" style="max-height: 200px;">
                        </div>

                    </div>
                    </div>
            </div>
        </div>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
