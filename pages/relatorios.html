<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - GestorLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Relatórios de Movimentação</h2>
                            <a href="dashboard.html" class="btn btn-outline-secondary">Voltar</a>
                        </div>

                        <div class="alert alert-info">
                            Selecione o período desejado para gerar o extrato de entradas, saídas e descartes.
                        </div>

                        <form id="form-relatorio" class="row g-3 mb-4 align-items-end">
                            <div class="col-md-4">
                                <label for="data-inicio" class="form-label fw-bold">Data Início</label>
                                <input type="date" class="form-control" id="data-inicio" required>
                            </div>
                            <div class="col-md-4">
                                <label for="data-fim" class="form-label fw-bold">Data Fim</label>
                                <input type="date" class="form-control" id="data-fim" required>
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="bi bi-file-earmark-spreadsheet"></i> Baixar Relatório (CSV)
                                </button>
                            </div>
                        </form>

                        <hr>

                        <h5 class="mb-3">Pré-visualização (Últimos 30 dias)</h5>
                        <div class="table-responsive">
                            <table class="table table-hover table-striped" id="tabela-preview">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Data</th>
                                        <th>Tipo</th>
                                        <th>Item</th>
                                        <th>Qtd.</th>
                                        <th>Detalhes</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-preview">
                                    <tr><td colspan="5" class="text-center text-muted">Carregando...</td></tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div> 
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/relatorios.js"></script>
</body>
</html>
