<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Movimentações - GestorLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <img src="../imagens/logo-labstocker-branco.png" alt="Logo UFC" class="img-fluid" style="max-height: 200px;">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Histórico de Trocas</h2>
                            <a href="dashboard.html" class="btn btn-outline-secondary">Voltar</a>
                        </div>

                        <div class="mb-4">
                            <input type="text" id="busca-historico" class="form-control" placeholder="Filtrar por reagente ou laboratório...">
                        </div>
                        
                        <div class="mb-3 small text-muted d-flex gap-3">
                            <span><i class="bi bi-arrow-down-circle-fill text-success"></i> Entrada (Recebido)</span>
                            <span><i class="bi bi-arrow-up-circle-fill text-danger"></i> Saída (Enviado)</span>
                        </div>
        
                        <div class="list-group" id="lista-historico">
                            </div>
                        
                        <div id="spinner-hist" class="text-center mt-4 d-none">
                            <div class="spinner-border" role="status"></div>
                        </div>

                    </div>
                </div> 
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/historico.js"></script>
</body>
</html>
