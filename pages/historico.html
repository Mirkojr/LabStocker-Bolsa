<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Movimentações - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #132E4B;">

    <script type="module" src="../js/authGuard.js"></script>

    <div id="toast-container"></div>

    <div class="container my-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4 text-white">
            <div class="d-flex align-items-center">
                <a href="dashboard.html" class="btn btn-outline-light me-3 rounded-circle border-2" style="width: 45px; height: 45px; display:flex; align-items:center; justify-content:center;">
                    <i class="bi bi-arrow-left fw-bold"></i>
                </a>
                <div>
                    <h2 class="mb-0 fw-bold">Linha do Tempo</h2>
                    <p class="mb-0 opacity-75 small">Rastreabilidade completa de insumos e descartes</p>
                </div>
            </div>
        </div>

        <div class="glass-panel-dark">
            
            <div class="mb-4">
                <div class="input-group shadow-sm rounded-pill overflow-hidden border border-white border-opacity-10">
                    <span class="input-group-text bg-white border-0 ps-3">
                        <i class="bi bi-search text-primary"></i>
                    </span>
                    <input type="text" id="busca-historico" class="form-control border-0 py-3" placeholder="Filtrar por reagente, laboratório ou tipo...">
                </div>
            </div>
            
            <div class="mb-4 small d-flex gap-3 px-2">
                <span class="text-success"><i class="bi bi-circle-fill me-1 small"></i> Entrada</span>
                <span class="text-danger"><i class="bi bi-circle-fill me-1 small"></i> Saída</span>
                <span class="text-secondary"><i class="bi bi-circle-fill me-1 small"></i> Descarte</span>
            </div>
            
            <div id="spinner-hist" class="text-center py-5 d-none">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted-light small">Reconstruindo histórico...</p>
            </div>

            <div class="list-group list-group-flush" id="lista-historico">
                </div>

        </div> 
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/historico.js"></script>
</body>
</html>
