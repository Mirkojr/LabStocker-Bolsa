<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Resíduos - Labstocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <img src="../imagens/logo-labstocker-branco.png" alt="Logo Labstocker" class="img-fluid" style="max-height: 200px;">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Controle de Resíduos</h2>
                            <a href="dashboard.html" class="btn btn-outline-secondary">Voltar</a>
                        </div>

                        <button class="btn btn-danger mb-4 w-100 py-2" data-bs-toggle="modal" data-bs-target="#modal-residuo">
                            <i class="bi bi-plus-circle"></i> Registrar Novo Frasco de Resíduo
                        </button>
                        
                        <div class="d-flex gap-2 mb-3 overflow-auto">
                            <span class="badge bg-secondary">Todos</span>
                            <span class="badge bg-warning text-dark">Inflamável</span>
                            <span class="badge bg-success">Tóxico</span>
                            <span class="badge bg-info text-dark">Corrosivo</span>
                        </div>
        
                        <div class="row g-3" id="lista-residuos"></div>
                        
                        <div id="spinner-res" class="text-center mt-4 d-none">
                            <div class="spinner-border" role="status"></div>
                        </div>

                    </div>
                </div> 
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-residuo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Novo Resíduo Químico</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-residuo">
                    <input type="hidden" id="edit-residuo-id">

                    <div class="modal-body">
                        
                        <div class="mb-3">
                            <label for="res-descricao" class="form-label">Descrição do Resíduo</label>
                            <input type="text" class="form-control" id="res-descricao" placeholder="Ex: Resto de Solvente Hexano" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo de Perigo Principal</label>
                            <select class="form-select" id="res-tipo" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="Inflamavel">Inflamável (Fogo)</option>
                                <option value="Toxico">Tóxico (Veneno)</option>
                                <option value="Corrosivo">Corrosivo (Ácido/Base)</option>
                                <option value="Biologico">Biológico</option>
                                <option value="Outro">Outro / Mistura</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label for="res-qtd" class="form-label">Quantidade</label>
                                <input type="number" step="0.01" class="form-control" id="res-qtd" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label for="res-unidade" class="form-label">Unidade</label>
                                <input type="text" class="form-control" id="res-unidade" placeholder="L, ml, Kg" required>
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Registrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/residuos.js"></script>
</body>
</html>
