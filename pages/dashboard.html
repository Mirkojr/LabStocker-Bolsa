<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5">
        
        <div class="text-center mb-5 logo-container">
            <img src="../imagens/logo-labstocker.png" alt="Logo LabStocker" class="img-fluid mb-3">
            <h5 id="user-greeting" class="text-white-50 fw-light">
                Carregando perfil... <span class="spinner-border spinner-border-sm"></span>
            </h5>
        </div>

        <div class="row g-4 justify-content-center">

            <div class="col-6 col-md-4 col-lg-3">
                <a href="estoque.html" class="dashboard-card">
                    <div class="icon-box bg-icon-primary">
                        <i class="bi bi-box-seam-fill"></i>
                    </div>
                    <span>Estoque</span>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a href="reagentes.html" class="dashboard-card">
                    <div class="icon-box bg-icon-success">
                        <i class="bi bi-eyedropper"></i>
                    </div>
                    <span>Reagentes</span>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a href="relatorios.html" class="dashboard-card">
                    <div class="icon-box bg-icon-info">
                        <i class="bi bi-file-earmark-bar-graph"></i>
                    </div>
                    <span>Relatórios</span>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a href="laboratorios.html" class="dashboard-card">
                    <div class="icon-box bg-icon-warning">
                        <i class="bi bi-building"></i>
                    </div>
                    <span>Laboratórios</span>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a href="usuarios.html" class="dashboard-card">
                    <div class="icon-box bg-icon-danger">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <span>Usuários</span>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a href="autorizacoes.html" class="dashboard-card">
                    <div class="icon-box bg-icon-secondary">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <span>Autorizações</span>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a href="residuos.html" class="dashboard-card">
                    <div class="icon-box bg-icon-dark">
                        <i class="bi bi-trash-fill"></i>
                    </div>
                    <span>Resíduos</span>
                </a>
            </div>
            
             <div class="col-6 col-md-4 col-lg-3">
                <a href="solicitacoes.html" class="dashboard-card">
                    <div class="icon-box bg-icon-success">
                        <i class="bi bi-arrow-left-right"></i>
                    </div>
                    <span>Solicitações</span>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a href="historico.html" class="dashboard-card">
                    <div class="icon-box bg-icon-primary">
                        <i class="bi bi-clock-history"></i>
                    </div>
                    <span>Histórico</span>
                </a>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <a href="suporte.html" class="dashboard-card">
                    <div class="icon-box bg-icon-purple">
                        <i class="bi bi-headset"></i>
                    </div>
                    <span>Suporte</span>
                </a>
            </div>

        </div>

        <div class="text-center mt-5 pt-4 border-top border-secondary">
            <button id="btn-logout" class="btn btn-logout-custom">
                <i class="bi bi-box-arrow-left me-2"></i> Encerrar Sessão
            </button>
        </div>
    </div>

    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
