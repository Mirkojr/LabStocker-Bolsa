<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Reagentes - GestorLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="background-color: #132E4B;">

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <img src="../imagens/logo-labstocker-branco.png" alt="Logo UFC" class="img-fluid" style="max-height: 250px;">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Catálogo de Reagentes</h2>
                            <a href="dashboard.html" class="btn btn-outline-secondary">Voltar ao Painel</a>
                        </div>
        
                        <div class="mb-3">
                            <input type="text" id="input-busca" class="form-control" placeholder="Pesquisar por nome...">
                        </div>
        
                        <div class="mb-3">
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-reagente">
                                Cadastrar Novo Reagente
                            </button>
                        </div>
        
                        <div class="list-group" id="lista-reagentes">
                            </div>
                        <div id="loading-spinner" class="text-center mt-4 d-none">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Carregando...</span>
                            </div>
                        </div>

                    </div>
                </div> </div>
        </div>
    </div>

    <div class="modal fade" id="modal-reagente" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cadastrar Novo Reagente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form-reagente">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="reagente-nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="reagente-nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="reagente-composicao" class="form-label">Composição Química</label>
                            <input type="text" class="form-control" id="reagente-composicao" required>
                        </div>
                        <div class="mb-3">
                            <label for="reagente-controladora" class="form-label">Instituição Controladora</label>
                            <input type="text" class="form-control" id="reagente-controladora">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/reagentes.js"></script>
</body>
</html>
