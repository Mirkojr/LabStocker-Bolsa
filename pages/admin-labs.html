<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Laboratórios (Admin) - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div class="card shadow-sm border-warning">
                    <div class="card-header bg-warning text-dark fw-bold">
                        <i class="bi bi-shield-lock-fill"></i> Área do Administrador
                    </div>
                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Gestão de Laboratórios</h2>
                            <a href="dashboard.html" class="btn btn-outline-dark">Voltar</a>
                        </div>

                        <div class="card bg-light mb-4">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Cadastrar Novo Laboratório</h5>
                                <form id="form-lab">
                                    <div class="row g-2">
                                        <div class="col-md-6">
                                            <input type="text" id="lab-nome" class="form-control" placeholder="Nome do Laboratório" required>
                                        </div>
                                        <div class="col-md-4">
                                            <input type="text" id="lab-sipac" class="form-control" placeholder="Código SIPAC" required>
                                        </div>
                                        <div class="col-md-2">
                                            <button type="submit" class="btn btn-dark w-100">Criar</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <hr>

                        <h5>Laboratórios Existentes</h5>
                        <ul class="list-group mt-3" id="lista-labs">
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm" role="status"></div> Carregando...
                            </div>
                        </ul>

                    </div>
                </div> 
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/admin-labs.js"></script>
</body>
</html>
