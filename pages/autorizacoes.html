<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Autorização - LabStocker/title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5" id="main-content" style="display: none;">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                
                <div class="card shadow-sm mb-5 border-0 bg-light">
                    <div class="card-body p-4">
                        <h4 class="mb-3 text-primary"><i class="bi bi-clock-history"></i> Minhas Solicitações Recentes</h4>
                        
                        <div id="lista-meus-projetos" class="list-group">
                            <div class="text-center py-3 text-muted">
                                <span class="spinner-border spinner-border-sm"></span> Carregando histórico...
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <img src="../imagens/logo-labstocker-branco.png" alt="Logo UFC" class="img-fluid" style="max-height: 200px;">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Nova Solicitação</h2>
                            <a href="dashboard.html" class="btn btn-outline-secondary">Voltar ao Painel</a>
                        </div>
        
                        <form id="form-projeto">
                            <h5 class="border-bottom pb-2 mb-3 text-primary">Dados do Responsável</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="responsavel-nome" class="form-label">Nome do(a) Responsável</label>
                                    <input type="text" class="form-control" id="responsavel-nome" required>
                                </div>
                                <div class="col-md-3">
                                    <label for="responsavel-siape" class="form-label">SIAPE</label>
                                    <input type="text" class="form-control" id="responsavel-siape">
                                </div>
                                <div class="col-md-3">
                                    <label for="responsavel-cpf" class="form-label">CPF</label>
                                    <input type="text" class="form-control" id="responsavel-cpf" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="responsavel-email" class="form-label">Email</label>
                                    <input type="email" class="form-control" id="responsavel-email" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="responsavel-telefone" class="form-label">Telefone</label>
                                    <input type="tel" class="form-control" id="responsavel-telefone">
                                </div>
                            </div>

                            <h5 class="border-bottom pb-2 mb-3 text-primary">Dados do Projeto e Laboratório</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <label for="projeto-titulo" class="form-label">Título do Projeto</label>
                                    <input type="text" class="form-control" id="projeto-titulo" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="projeto-orgao" class="form-label">Órgão Financiador</label>
                                    <input type="text" class="form-control" id="projeto-orgao">
                                </div>
                                <div class="col-md-3">
                                    <label for="projeto-registro" class="form-label">Nº de Registro</label>
                                    <input type="text" class="form-control" id="projeto-registro">
                                </div>
                                <div class="col-md-3">
                                    <label for="projeto-periodo" class="form-label">Período de Execução</label>
                                    <input type="text" class="form-control" id="projeto-periodo" placeholder="Ex: Jan/24 a Dez/24">
                                </div>
                                <div class="col-md-8">
                                    <label for="lab-nome" class="form-label">Nome do Laboratório</label>
                                    <input type="text" class="form-control" id="lab-nome" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="lab-sipac" class="form-label">Código SIPAC do Laboratório</label>
                                    <input type="text" class="form-control" id="lab-sipac">
                                </div>
                            </div>

                            <h5 class="border-bottom pb-2 mb-3 text-primary d-flex justify-content-between align-items-center">
                                Relação dos Produtos
                                <button type="button" class="btn btn-sm btn-success" id="btn-add-produto">
                                    <i class="bi bi-plus-circle"></i> Adicionar Produto
                                </button>
                            </h5>
                            
                            <div class="table-responsive mb-4">
                                <table class="table table-bordered table-hover align-middle" id="tabela-produtos">
                                    <thead class="table-light">
                                        <tr>
                                            <th style="width: 50px;" class="text-center">#</th>
                                            <th>Nomenclatura do Produto</th>
                                            <th style="width: 150px;">Quantidade</th>
                                            <th style="width: 180px;">Unidade de Medida</th>
                                            <th style="width: 50px;" class="text-center">Ação</th>
                                        </tr>
                                    </thead>
                                    <tbody id="lista-produtos-body">
                                        <tr>
                                            <td class="text-center index-item">1</td>
                                            <td><input type="text" class="form-control" name="produto_nome[]" required></td>
                                            <td><input type="number" class="form-control" name="produto_qtd[]" required></td>
                                            <td>
                                                <select class="form-select" name="produto_unidade[]">
                                                    <option value="un">Unidade (un)</option>
                                                    <option value="mL">Mililitros (mL)</option>
                                                    <option value="L">Litros (L)</option>
                                                    <option value="g">Gramas (g)</option>
                                                    <option value="kg">Quilogramas (kg)</option>
                                                    <option value="caixa">Caixa</option>
                                                </select>
                                            </td>
                                            <td class="text-center">
                                                <button type="button" class="btn btn-outline-danger btn-sm btn-remove-item" disabled>
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="reset" class="btn btn-light me-md-2">Limpar Formulário</button>
                                <button type="submit" class="btn btn-primary btn-lg">Enviar Solicitação</button>
                            </div>
                        </form>
                    </div>
                </div> 
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="modalDetalhes" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-primary" id="modalTitulo">Detalhes do Projeto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="modal-status-area" class="alert mb-3 d-flex justify-content-between align-items-center">
                        <span id="modal-status-text" class="fw-bold"></span>
                        <a href="#" id="modal-btn-download" class="btn btn-sm btn-success d-none" target="_blank">
                            <i class="bi bi-download"></i> Baixar Documento
                        </a>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="text-muted small">Título</label>
                            <div class="fw-bold" id="modal-projeto-titulo"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Responsável</label>
                            <div id="modal-resp-nome"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">CPF</label>
                            <div id="modal-resp-cpf"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Email</label>
                            <div id="modal-resp-email"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Telefone</label>
                            <div id="modal-resp-telefone"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="text-muted small">Laboratório</label>
                            <div id="modal-lab-nome"></div>
                        </div>
                    </div>

                    <hr>
                    <h6 class="text-primary">Produtos Solicitados</h6>
                    <ul id="modal-lista-produtos" class="list-group list-group-flush small bg-light rounded"></ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="auth-loading" class="text-center mt-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Verificando...</span>
        </div>
        <p class="mt-2">Carregando...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/autorizacoes.js"></script>

</body>
</html>
