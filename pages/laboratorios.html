<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratórios Parceiros - LabStocker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        

                        <div class="text-center mb-4">
                            <img src="../imagens/logo-labstocker-branco.png" alt="Logo UFC" class="img-fluid" style="max-height: 200px;">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Laboratórios Parceiros</h2>
                            <a href="dashboard.html" class="btn btn-outline-secondary">Voltar</a>
                        </div>
        
                        <div class="mb-3">
                            <input type="text" id="busca-lab" class="form-control" placeholder="Buscar laboratório...">
                        </div>
        
                        <div id="grid-laboratorios" class="row g-3">
                            </div>
                        
                        <div id="spinner-lab" class="text-center mt-4 d-none">
                            <div class="spinner-border" role="status"></div>
                        </div>

                    </div>
                </div> 
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-estoque-externo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg"> <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-lab-selecionado">Estoque do Laboratório</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="busca-estoque-externo" class="form-control mb-3" placeholder="Filtrar reagentes...">
                    
                    <div class="list-group" id="lista-estoque-externo">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-solicitar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered"> <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Solicitar Reagente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-solicitacao">
                    <div class="modal-body">
                        <p id="texto-solicitacao" class="small mb-2">Quanto você precisa?</p>
                        
                        <div class="input-group mb-3">
                            <input type="number" step="0.01" class="form-control" id="qtd-solicitada" required>
                            <span class="input-group-text" id="unidade-solicitada">un</span>
                        </div>
                        <div class="form-text text-danger d-none" id="erro-qtd">Quantidade indisponível.</div>

                        <input type="hidden" id="solic-item-id">
                        <input type="hidden" id="solic-lab-destino">
                        <input type="hidden" id="solic-max-qtd">

                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary w-100">Enviar Pedido</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/laboratorios.js"></script>
</body>
</html>
