<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Estoque - GestorLab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <script type="module" src="../js/authGuard.js"></script>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-10 mx-auto">
                
                <div class="card shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="text-center mb-4">
                            <img src="../imagens/logo-labstocker-branco.png" alt="Logo UFC" class="img-fluid" style="max-height: 200px;">
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="mb-0">Estoque do Laboratório</h2>
                            <a href="dashboard.html" class="btn btn-outline-secondary">Voltar ao Painel</a>
                        </div>
        
                        <div class="mb-3">
                            <input type="text" id="input-busca-estoque" class="form-control" placeholder="Pesquisar por nome no estoque...">
                        </div>
        
                        <div class="mb-3">
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modal-estoque">
                                Adicionar Item ao Estoque
                            </button>
                        </div>
        
                        <div class="list-group" id="lista-estoque">
                            </div>
                        <div id="loading-spinner-estoque" class="text-center mt-4 d-none">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Carregando...</span>
                            </div>
                        </div>

                    </div>
                </div> 
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-estoque" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adicionar Item ao Estoque</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <form id="form-estoque">
                    <input type="hidden" id="estoque-edit-id">
                    
                    <div class="modal-body">
                        
                        <div class="mb-3">
                            <label for="estoque-reagente" class="form-label">Reagente (do Catálogo)</label>
                            <select class="form-select" id="estoque-reagente" required>
                                <option value="" disabled selected>Carregando reagentes...</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-8 mb-3">
                                <label for="estoque-quantidade" class="form-label">Quantidade</label>
                                <input type="number" step="0.01" class="form-control" id="estoque-quantidade" required>
                            </div>
                            <div class="col-4 mb-3">
                                <label for="estoque-unidade" class="form-label">Unidade</label>
                                <input type="text" class="form-control" id="estoque-unidade" placeholder="ml, g, L" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="estoque-validade" class="form-label">Data de Validade</label>
                            <input type="date" class="form-control" id="estoque-validade">
                        </div>

                        <div class="mb-3">
                            <label for="estoque-observacoes" class="form-label">Observações Operacionais</label>
                            <textarea class="form-control" id="estoque-observacoes" rows="3"></textarea>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar no Estoque</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../js/estoque.js"></script>
</body>
</html>
